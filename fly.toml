# Fly.io replaces Railway: one always-on machine + a volume for SQLite.
#   fly auth login
#   fly apps create trymesh
#   fly volumes create mesh_data --size 1 --region iad
#   fly deploy
# Then point trymesh.chat at the Fly IPv4/IPv6.

app = "trymesh"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  MESH_DATA_DIR = "/app/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  grace_period = "10s"
  interval = "15s"
  method = "GET"
  path = "/health"
  timeout = "5s"

[mounts]
  source = "mesh_data"
  destination = "/app/data"
